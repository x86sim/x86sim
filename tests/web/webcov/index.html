<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>webcov</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
	body { font: 13px -apple-system, system-ui, sans-serif; margin: 8px; }
	#hdr { font-weight: 600; } #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.s-PASS { color: #070; } .s-FAIL, .s-CRASH { color: #b00; } .s-TIMEOUT { color: #b60; } .s-UNSUPPORTED { color: #777; }
	#stage { position: relative; min-height: 10px; }
	#tap { display: none; position: fixed; inset: 0; z-index: 99; align-items: center; justify-content: center;
		background: rgba(0, 80, 200, .85); color: #fff; font-size: 28px; border: 0; width: 100%; height: 100%; }
</style>
</head><body>
<div id="hdr">webcov <span id="count"></span> · <span id="cur">loading</span></div>
<div id="stage"></div>
<div id="log"></div>
<button id="tap">tap</button>
<script src="harness.js"></script>
<script src="checks/js.js"></script>
<script src="checks/workers.js"></script>
<script src="checks/storage.js"></script>
<script src="checks/network.js"></script>
<script src="checks/graphics.js"></script>
<script src="checks/media.js"></script>
<script src="checks/device.js"></script>
<script src="checks/dom.js"></script>
<script src="checks/perf.js"></script>
</body></html>
